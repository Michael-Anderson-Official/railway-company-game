<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>鉄道会社経営ゲーム | 配線エディタ</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background: #f7f8fa;
      color: #182330;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    .app { display: flex; flex-direction: column; height: 100dvh; min-height: 400px; }
    .header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 15px 24px; background: #fff; border-bottom: 1px solid #e6eaf0;
    }
    h1 { margin: 0; font-size: 15px; font-weight: 750; letter-spacing: .02em; }
    .subtitle { margin: 4px 0 0; color: #798493; font-size: 11px; }
    .tool {
      display: flex; align-items: center; gap: 11px;
      border: 1px solid #e3e9f0; border-radius: 12px; background: #fff;
      padding: 7px 11px 7px 7px;
    }
    .tool button {
      display: inline-flex; gap: 9px; align-items: center; justify-content: center;
      padding: 9px 13px; border: 1px solid #d5dee7; border-radius: 8px;
      background: #fff; color: #203047; font: inherit; font-size: 12px;
      font-weight: 700; cursor: pointer;
    }
    .tool button[aria-pressed="true"] {
      color: #fff; background: #2d5aa7; border-color: #2d5aa7;
      box-shadow: 0 3px 9px #2d5aa71e;
    }
    .tool button:focus-visible { outline: 3px solid #86b3ff; outline-offset: 2px; }
    .tool svg { width: 42px; height: 25px; }
    .tool-hint { white-space: nowrap; font-size: 11px; color: #798493; }
    .workspace { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #fff; }
    #board { display: block; width: 100%; height: 100%; touch-action: none; }
    #board.placing { cursor: crosshair; }
    .track { fill: none; stroke: #303e4d; stroke-width: 5; stroke-linecap: round; }
    .platform { fill: #e8edf1; stroke: #778594; stroke-width: 2; }
    .platform-inset { fill: none; stroke: #b6c0ca; stroke-width: 1; }
    .preview { opacity: .42; pointer-events: none; }
    .hint {
      position: absolute; bottom: 20px; left: 24px; pointer-events: none;
      padding: 9px 12px; background: #f7f8fbd9; color: #64758a;
      border: 1px solid #edf0f3; border-radius: 8px; font-size: 12px;
    }
    @media(max-width: 700px) {
      .header { align-items: flex-start; flex-direction: column; gap: 12px; padding: 13px 16px; }
      .tool { width: 100%; }
      .tool-hint { white-space: normal; }
      .hint { bottom: 14px; left: 14px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <h1>鉄道会社経営ゲーム</h1>
        <p class="subtitle">配線エディタ</p>
      </div>
      <div class="tool" role="toolbar" aria-label="配置する設備">
        <button id="place-tool" type="button" aria-pressed="false">
          <svg viewBox="0 0 66 38" fill="none" aria-hidden="true">
            <path d="M3 7H63M3 31H63" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
            <rect x="12" y="13" width="42" height="12" rx="3" fill="currentColor" opacity=".2" stroke="currentColor" stroke-width="1.4"/>
          </svg>
          1面2線
        </button>
        <span class="tool-hint">選択後タップで配置・2本指で拡大縮小</span>
      </div>
    </header>
    <section class="workspace" aria-label="線路を配置する白紙のキャンバス">
      <svg id="board" viewBox="0 0 1440 820" preserveAspectRatio="xMidYMid meet" role="img" aria-label="配線図を作成する白紙のキャンバス">
        <g id="placed"></g>
        <g id="preview" class="preview" visibility="hidden"></g>
      </svg>
      <div id="hint" class="hint" role="status">「1面2線」を選んで配置できます</div>
    </section>
  </main>
  <script>
    (() => {
      'use strict';

      const svg = document.querySelector('#board');
      const placed = document.querySelector('#placed');
      const preview = document.querySelector('#preview');
      const button = document.querySelector('#place-tool');
      const hint = document.querySelector('#hint');
      const SVG_NS = 'http://www.w3.org/2000/svg';
      const positions = [];
      const touches = new Map();
      const MAX_ZOOM = 4;
      const TAP_SLOP = 14;
      let placing = false;
      let canvasSize = { width: 1440, height: 820 };
      let view = { x: 0, y: 0, width: 1440, height: 820 };
      let pendingTouchPlacement = null;
      let pinchStart = null;

      // 島式ホーム1面を2本の線路で挟む、独立した配線ユニット。
      function createStation(x, y) {
        const group = document.createElementNS(SVG_NS, 'g');
        group.setAttribute('transform', `translate(${x} ${y})`);
        const tracks = [-47, 47];
        for (const offset of tracks) {
          const line = document.createElementNS(SVG_NS, 'path');
          line.setAttribute('class', 'track');
          line.setAttribute('d', `M -195 ${offset} H 195`);
          group.append(line);
        }
        const platform = document.createElementNS(SVG_NS, 'rect');
        platform.setAttribute('class', 'platform');
        platform.setAttribute('x', '-135');
        platform.setAttribute('y', '-29');
        platform.setAttribute('width', '270');
        platform.setAttribute('height', '58');
        platform.setAttribute('rx', '6');
        group.append(platform);
        const inset = document.createElementNS(SVG_NS, 'rect');
        inset.setAttribute('class', 'platform-inset');
        inset.setAttribute('x', '-127');
        inset.setAttribute('y', '-21');
        inset.setAttribute('width', '254');
        inset.setAttribute('height', '42');
        inset.setAttribute('rx', '3');
        group.append(inset);
        return group;
      }

      function pointerOnCanvas(event) {
        const matrix = svg.getScreenCTM();
        if (!matrix) return null;
        const point = svg.createSVGPoint();
        point.x = event.clientX;
        point.y = event.clientY;
        const local = point.matrixTransform(matrix.inverse());
        return {
          x: Math.max(195, Math.min(canvasSize.width - 195, local.x)),
          y: Math.max(47, Math.min(canvasSize.height - 47, local.y))
        };
      }

      function applyView(next) {
        const width = Math.max(canvasSize.width / MAX_ZOOM, Math.min(canvasSize.width, next.width));
        const height = width * canvasSize.height / canvasSize.width;
        view = {
          x: Math.max(0, Math.min(canvasSize.width - width, next.x)),
          y: Math.max(0, Math.min(canvasSize.height - height, next.y)),
          width,
          height
        };
        svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.width} ${view.height}`);
      }

      function beginPinch() {
        if (touches.size !== 2) return;
        const [a, b] = [...touches.values()];
        const bounds = svg.getBoundingClientRect();
        const midX = (a.x + b.x) / 2;
        const midY = (a.y + b.y) / 2;
        pinchStart = {
          distance: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
          width: view.width,
          anchorX: view.x + (midX - bounds.left) / bounds.width * view.width,
          anchorY: view.y + (midY - bounds.top) / bounds.height * view.height
        };
      }

      function updatePinch() {
        if (!pinchStart || touches.size !== 2) return;
        const [a, b] = [...touches.values()];
        const distance = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
        const bounds = svg.getBoundingClientRect();
        const width = Math.max(canvasSize.width / MAX_ZOOM,
          Math.min(canvasSize.width, pinchStart.width * pinchStart.distance / distance));
        const height = width * canvasSize.height / canvasSize.width;
        const midX = (a.x + b.x) / 2;
        const midY = (a.y + b.y) / 2;
        applyView({
          x: pinchStart.anchorX - (midX - bounds.left) / bounds.width * width,
          y: pinchStart.anchorY - (midY - bounds.top) / bounds.height * height,
          width
        });
      }

      function placeStation(event) {
        if (!placing) return;
        const point = pointerOnCanvas(event);
        if (!point) return;
        positions.push({ xRatio: point.x / canvasSize.width, yRatio: point.y / canvasSize.height });
        placed.append(createStation(point.x, point.y));
        hint.textContent = `1面2線：${positions.length}か所配置済み`;
        preview.setAttribute('visibility', 'hidden');
      }

      function fitCanvas() {
        const bounds = svg.getBoundingClientRect();
        if (!bounds.width || !bounds.height) return;
        // スマートフォン縦画面でも、ホームを画面幅いっぱいに近い大きさで表示する。
        const width = Math.max(480, Math.round(bounds.width * 1.05));
        const height = Math.round(width * bounds.height / bounds.width);
        canvasSize = { width, height };
        applyView({ x: 0, y: 0, width });
        pinchStart = null;
        placed.replaceChildren(...positions.map(({ xRatio, yRatio }) => createStation(
          Math.max(195, Math.min(width - 195, xRatio * width)),
          Math.max(47, Math.min(height - 47, yRatio * height))
        )));
        preview.setAttribute('visibility', 'hidden');
      }

      function showPreview(event) {
        if (!placing || touches.size || event.pointerType === 'touch') return;
        const point = pointerOnCanvas(event);
        if (!point) return;
        preview.replaceChildren(createStation(point.x, point.y));
        preview.setAttribute('visibility', 'visible');
      }

      button.addEventListener('click', () => {
        placing = !placing;
        button.setAttribute('aria-pressed', String(placing));
        svg.classList.toggle('placing', placing);
        preview.setAttribute('visibility', 'hidden');
        hint.textContent = placing ? '白紙の好きな場所をクリックして配置' : '「1面2線」を選んで配置できます';
      });

      svg.addEventListener('pointermove', event => {
        if (event.pointerType === 'touch') {
          const touch = touches.get(event.pointerId);
          if (!touch) return;
          touch.x = event.clientX;
          touch.y = event.clientY;
          if (pendingTouchPlacement && pendingTouchPlacement.id === event.pointerId &&
              Math.hypot(touch.x - pendingTouchPlacement.x, touch.y - pendingTouchPlacement.y) > TAP_SLOP) {
            pendingTouchPlacement = null;
          }
          updatePinch();
          event.preventDefault();
          return;
        }
        showPreview(event);
      });
      svg.addEventListener('pointerleave', () => preview.setAttribute('visibility', 'hidden'));
      svg.addEventListener('pointerdown', event => {
        if (event.pointerType === 'touch') {
          touches.set(event.pointerId, { x: event.clientX, y: event.clientY });
          svg.setPointerCapture(event.pointerId);
          pendingTouchPlacement = touches.size === 1 && placing
            ? { id: event.pointerId, x: event.clientX, y: event.clientY } : null;
          pinchStart = null;
          beginPinch();
          preview.setAttribute('visibility', 'hidden');
          event.preventDefault();
          return;
        }
        if (event.button !== 0) return;
        placeStation(event);
        event.preventDefault();
      });
      svg.addEventListener('pointerup', event => {
        if (event.pointerType !== 'touch') return;
        const tap = pendingTouchPlacement && pendingTouchPlacement.id === event.pointerId &&
          touches.size === 1 &&
          Math.hypot(event.clientX - pendingTouchPlacement.x,
            event.clientY - pendingTouchPlacement.y) <= TAP_SLOP;
        touches.delete(event.pointerId);
        pendingTouchPlacement = null;
        pinchStart = null;
        beginPinch();
        if (tap) placeStation(event);
        event.preventDefault();
      });
      svg.addEventListener('pointercancel', event => {
        touches.delete(event.pointerId);
        pendingTouchPlacement = null;
        pinchStart = null;
        beginPinch();
        preview.setAttribute('visibility', 'hidden');
      });

      window.addEventListener('resize', fitCanvas);
      fitCanvas();
    })();
  </script>
</body>
</html>
